server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow" always;
  # Preview site: browsers revalidate every request so updates show without a hard refresh.
  add_header Cache-Control "no-cache" always;
  # The invitation form moved to the application site.
  location = /invite { return 301 https://apply.payset.io/; }
  location = /invite.html { return 301 https://apply.payset.io/; }
  # The contact form lives on the application site, next to the leads it feeds.
  location ~ ^/contact/?$ { return 301 https://apply.payset.io/contact; }
  location / { try_files $uri $uri.html $uri/ =404; }
}
