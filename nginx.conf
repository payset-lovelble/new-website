server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag "noindex, nofollow" always;
  # Preview site: browsers revalidate every request so updates show without a hard refresh.
  add_header Cache-Control "no-cache" always;
  # The invitation form moved to the main site's application page.
  location = /invite { return 301 https://www.payset.io/apply; }
  location = /invite.html { return 301 https://www.payset.io/apply; }
  location / { try_files $uri $uri.html $uri/ =404; }
}
